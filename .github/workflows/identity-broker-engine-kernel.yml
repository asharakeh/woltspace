name: Engine kernel feasibility

on:
  push:
    branches: [test/identity-broker-engine-kernel]

permissions:
  contents: read

jobs:
  engine-kernel:
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: env -i PATH=/usr/local/bin:/usr/bin:/bin bash test/engine-kernel/run.sh
