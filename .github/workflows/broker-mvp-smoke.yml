name: Broker MVP smoke

on:
  push:
    branches: [test/broker-mvp-smoke]

permissions:
  contents: read

jobs:
  broker-mvp:
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: env -i PATH=/usr/local/bin:/usr/bin:/bin bash test/broker-mvp-smoke.sh
